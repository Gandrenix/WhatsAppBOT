services:
  bot:
    build: .
    container_name: morgan-bot
    restart: unless-stopped   # se reinicia solo si falla o si se reinicia el servidor
    init: true                # limpia procesos zombi de Chromium
    shm_size: "512mb"
    env_file: .env            # GEMINI_API_KEY, GEMINI_MODEL, OWNER_NUMBER (el .env NO está en git)
    environment:
      DATA_DIR: /app/data
    volumes:
      - wa_data:/app/data     # sesión de WhatsApp + citas.jsonl: sobreviven a reinicios y actualizaciones
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wa_data:
